<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign up — pesa tracker</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💰</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f7;
            color: #1c1c1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .auth-card {
            width: 100%;
            max-width: 380px;
            background: #ffffff;
            border: 1px solid #e5e5ea;
            border-radius: 16px;
            padding: 40px 32px 32px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .logo-mark {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: #1c1c1e;
            color: #fff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 14px;
        }
        .auth-title {
            font-size: 22px;
            font-weight: 600;
            margin: 0 0 4px;
            color: #1c1c1e;
        }
        .auth-subtitle {
            font-size: 14px;
            color: #8e8e93;
            margin: 0;
        }
        .field-group {
            margin-bottom: 16px;
        }
        .field-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #636366;
            margin-bottom: 6px;
        }
        .field-group input {
            width: 100%;
            padding: 11px 14px;
            font-size: 15px;
            border: 1.5px solid #e5e5ea;
            border-radius: 10px;
            background: #fafafa;
            color: #1c1c1e;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .field-group input:focus {
            border-color: #1c1c1e;
            box-shadow: 0 0 0 3px rgba(28,28,30,0.08);
        }
        .field-group input::placeholder {
            color: #c7c7cc;
        }
        .field-group input.error {
            border-color: #ff3b30;
        }
        .password-wrap {
            position: relative;
        }
        .password-wrap input {
            padding-right: 44px;
        }
        .toggle-visibility {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #8e8e93;
            cursor: pointer;
            padding: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.15s, background 0.15s;
        }
        .toggle-visibility:hover {
            color: #1c1c1e;
            background: #f2f2f7;
        }
        .strength-bar {
            height: 3px;
            background: #e5e5ea;
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            width: 0%;
            border-radius: 2px;
            transition: width 0.2s ease, background 0.2s ease;
        }
        .hint {
            font-size: 12px;
            color: #8e8e93;
            margin: 6px 0 0;
        }
        .hint.error { color: #ff3b30; }
        .hint.success { color: #34c759; }
        .checkbox-label {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            color: #636366;
            line-height: 1.4;
            margin-bottom: 20px;
        }
        .checkbox-label input { display: none; }
        .check-box {
            width: 18px;
            height: 18px;
            border: 1.5px solid #d1d1d6;
            border-radius: 5px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: border-color 0.15s, background 0.15s;
            flex-shrink: 0;
            margin-top: 1px;
        }
        .checkbox-label input:checked + .check-box {
            border-color: #1c1c1e;
            background: #1c1c1e;
        }
        .checkbox-label input:checked + .check-box::after {
            content: '';
            width: 5px;
            height: 9px;
            border: solid #fff;
            border-width: 0 1.5px 1.5px 0;
            transform: rotate(45deg) translate(-1px, -1px);
        }
        .text-link {
            color: #1c1c1e;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.15s;
        }
        .text-link:hover { opacity: 0.7; }
        .submit-btn {
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: 600;
            color: #fff;
            background: #1c1c1e;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: opacity 0.15s, transform 0.1s;
        }
        .submit-btn:hover { opacity: 0.9; }
        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .form-footer {
            text-align: center;
            font-size: 13px;
            color: #8e8e93;
            margin: 18px 0 0;
        }
        .error-msg {
            background: #fff2f2;
            color: #ff3b30;
            font-size: 13px;
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 16px;
            display: none;
            border: 1px solid #ff3b3030;
        }
        .error-msg.show { display: block; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-5px); }
            80% { transform: translateX(5px); }
        }
        .shake { animation: shake 0.35s ease-in-out; }
    </style>
</head>
<body>
    <div class="auth-card">
        <div class="auth-header">
            <div class="logo-mark">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
                </svg>
            </div>
            <h1 class="auth-title">create account</h1>
            <p class="auth-subtitle">start tracking your money today</p>
        </div>

        <div class="error-msg" id="error-msg"></div>

        <form id="signup-form">
            <div class="field-group">
                <label for="name">full name</label>
                <input type="text" id="name" placeholder="john doe" required />
            </div>
            <div class="field-group">
                <label for="email">email</label>
                <input type="email" id="email" placeholder="you@example.com" required />
            </div>
            <div class="field-group">
                <label for="password">password</label>
                <div class="password-wrap">
                    <input type="password" id="password" placeholder="min 8 characters" required minlength="8" />
                    <button type="button" class="toggle-visibility" id="toggle-pw" aria-label="show password">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
                <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
                <p class="hint" id="password-hint">use 8+ characters with letters and numbers</p>
            </div>
            <div class="field-group">
                <label for="confirm">confirm password</label>
                <input type="password" id="confirm" placeholder="••••••••" required />
                <p class="hint error" id="match-hint" style="display:none;">passwords do not match</p>
            </div>
            <label class="checkbox-label">
                <input type="checkbox" id="terms" required />
                <span class="check-box"></span>
                <span>i agree to the <a href="#" class="text-link">terms</a> and <a href="#" class="text-link">privacy policy</a></span>
            </label>
            <button type="submit" class="submit-btn" id="submit-btn">create account</button>
            <p class="form-footer">already have an account? <a href="login.html" class="text-link">log in</a></p>
        </form>
    </div>

    <!-- firebase auth -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
        import {
            getAuth,
            createUserWithEmailAndPassword,
            updateProfile,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

        // 🔧 replace with your firebase config (same as in firebase.js)
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // redirect if already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "index.html";
            }
        });

        const form = document.getElementById("signup-form");
        const nameInput = document.getElementById("name");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const confirmInput = document.getElementById("confirm");
        const submitBtn = document.getElementById("submit-btn");
        const errorMsg = document.getElementById("error-msg");
        const togglePw = document.getElementById("toggle-pw");
        const strengthFill = document.getElementById("strength-fill");
        const passwordHint = document.getElementById("password-hint");
        const matchHint = document.getElementById("match-hint");

        // password visibility toggle
        togglePw.addEventListener("click", () => {
            const isHidden = passwordInput.type === "password";
            passwordInput.type = isHidden ? "text" : "password";
            togglePw.setAttribute("aria-label", isHidden ? "hide password" : "show password");
            togglePw.innerHTML = isHidden
                ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>`
                : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;
        });

        // password strength meter
        passwordInput.addEventListener("input", () => {
            const val = passwordInput.value;
            let score = 0;
            if (val.length >= 8) score++;
            if (/[a-zA-Z]/.test(val) && /\d/.test(val)) score++;
            if (/[^a-zA-Z0-9]/.test(val)) score++;

            const widths = ["0%", "33%", "66%", "100%"];
            const colors = ["transparent", "#ff9500", "#34c759", "#34c759"];
            strengthFill.style.width = widths[score];
            strengthFill.style.background = colors[score];

            if (score === 0 && val.length > 0) {
                passwordHint.textContent = "too weak — add more characters";
                passwordHint.className = "hint error";
            } else if (score === 1) {
                passwordHint.textContent = "weak — mix letters and numbers";
                passwordHint.className = "hint error";
            } else if (score === 2) {
                passwordHint.textContent = "good — add a symbol for strength";
                passwordHint.className = "hint success";
            } else if (score === 3) {
                passwordHint.textContent = "strong password";
                passwordHint.className = "hint success";
            } else {
                passwordHint.textContent = "use 8+ characters with letters and numbers";
                passwordHint.className = "hint";
            }
        });

        // clear match error on input
        confirmInput.addEventListener("input", () => {
            matchHint.style.display = "none";
            confirmInput.classList.remove("error");
        });

        function showError(msg) {
            errorMsg.textContent = msg;
            errorMsg.classList.add("show");
            form.classList.add("shake");
            setTimeout(() => form.classList.remove("shake"), 350);
        }

        function clearError() {
            errorMsg.classList.remove("show");
            errorMsg.textContent = "";
        }

        function mapError(code) {
            const map = {
                "auth/email-already-in-use": "an account with this email already exists",
                "auth/invalid-email": "invalid email address",
                "auth/weak-password": "password is too weak. use at least 6 characters",
                "auth/operation-not-allowed": "email/password sign-up is not enabled",
                "auth/network-request-failed": "network error. check your connection"
            };
            return map[code] || "something went wrong. please try again";
        }

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearError();

            const name = nameInput.value.trim();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            const confirm = confirmInput.value;

            // validate password match
            if (password !== confirm) {
                matchHint.style.display = "block";
                confirmInput.classList.add("error");
                form.classList.add("shake");
                setTimeout(() => form.classList.remove("shake"), 350);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "creating account...";

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: name });
                window.location.href = "index.html";
            } catch (err) {
                showError(mapError(err.code));
                submitBtn.disabled = false;
                submitBtn.textContent = "create account";
            }
        });
    </script>
</body>
</html>
