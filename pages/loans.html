<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loans</title>
    <link rel="stylesheet" href="../styles/loans.css">
    <script src="../script/ui.js" defer></script>
    <script type="module" src="../script/loans.js" defer></script>
</head>
<body>

    
    
    
    <div class="loan-container">
        <nav>
           
            <ul class="nav-links">
                <li><a href="../index.html">Dashboard</a></li>
                <li><a href="./accounts.html">Accounts</a></li>
                <li><a href="./expenses.html">Expenses</a></li>
                <li><a href="./income.html">Income</a></li>
                <li><a href="">Goals</a></li>
                <li><a href="./reports.html">Reports</a></li>
            </ul>
        </nav>
        <div class="search">
    
            <div class="search-transaction">
                <input type="text" name="search-transaction" placeholder="search loan...">
                <button type="submit" class="search-btn">
                    <img src="../icons/search.png" alt="search icon">
                </button>
            </div>
        </div>
        <h1>Loan Manager</h1>
        <div class="loan-overview">
            <div class="loan-cards total-loans">
                <p>Number of Loans</p>
                <p id="loan-number">0</p>

            </div>
            <div class="loan-cards total-balance">
                <p>Total Balance</p>
                <p id="loan-balance">Ksh. 0</p>
            </div>
            <div class="loan-cards upcoming-payment">
                <p>Upcoming payment</p>
                <p class="payment-amount">Ksh. 0</p>
            </div>
        </div>    

        <div class="loan-actions">

            
        <button id="openPayModalBtn">Pay Loan</button>

        <!-- The Pop-up Overlay Container Wrapper -->
        <div id="payLoanModal" class="modal-overlay">
            
            
            <div class="add-loan-form pay-loan-form">
                
                <span class="close-modal-btn" id="closePayModalBtn">&times;</span>

                <form action="">
                    <caption><h2>Pay loan</h2></caption>
                    <label for="loanName">Choose Loan</label>
                    <select name="loanName" id="loanName">
                        <option value="">Choose loan</option>
                        <option value="bridge">Bridge</option>
                        <option value="fuliza">Fuliza</option>
                    </select>
                    <div class="middle">
                        <div class="loan-amount payment-amount">
                            <label for="paymentAmount">Amount</label>
                            <input type="text" name="paymentAmount" id="paymentAmount">
                        </div>
                        <div class="loan-due-date">
                            <label for="paymentDate">Payment Date</label>
                            <input type="date" name="paymentDate" id="paymentDate">
                        </div>
                    </div>
                    
                    <label for="paymentAccount">Choose Account</label>
                    <select name="paymentAccount" id="paymentAccount">
                        <option value="Mpesa">Mpesa</option>
                        <option value="savings">Savings</option>
                        <option value="fuliza">Fuliza</option>
                    </select>
                    <button id="payLoanButton">Pay Loan</button>
                </form>
            </div>
            

        </div>

        
        <button id="openAddModalBtn">Add Loan</button>

        
        <div id="addLoanModal" class="modal-overlay">

            <div class="add-loan">
                <div class="add-loan-form">
                
                    <span class="close-modal-btn" id="closeAddModalBtn">&times;</span>
                    
                    <form action="">
                        <caption><h2>Add a loan</h2></caption>
                        <label for="addLoanName">Loan Name</label>
                        <input type="text" name="loanName" id="addLoanName">
                        <div class="middle">
                            <div class="loan-amount">
                                <label for="loanAmount">Amount</label>
                                <input type="text" name="loanAmount" id="loanAmount">
                            </div>
                           
                            <div class="loan-due-date">
                                <label for="dueDate">Due Date</label>
                                <input type="date" name="dueDate" id="dueDate">
                            </div>
                        </div>
                        <div class="loan-limit">
                            <label for="loanLimit">Loan Limit</label>
                            <input type="text" name="loanLimit" id="loanLimit">
                        </div>
                        <div class="loan-balance">
                                <label for="loanBalance">Remaining Balance</label>
                                <input type="text" name="loanBalance" id="loanBalance">
                        </div>
                        <div class="loan-due-date">
                            <label for="dateTaken">Date Taken</label>
                            <input type="date" name="dateTaken" id="dateTaken">
                        </div>
                        <div class="loan-due-date">
                            <label for="lastInterestDate">Last Interest Date</label>
                            <input type="date" name="lastInterestDate" id="lastInterestDate">
                        </div>

                        
                        <label for="interest">Interest Rate</label>
                        <input type="text" name="interest" id="interest">
                        <button id="addLoanButton">Add Loan</button>
                    </form>
                </div>
            </div>

        </div>

        </div>

</body>
