<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="./styles/style.css"> 

</head>
<body>
    <div class="grid-container">

        <div class="sidebar">
            <div class="logo">
                <img src="./images/velocity logo.png" alt="logo">
            </div>
            <h3>Velocity Inc</h3>

            <ul>
                <div class="icon dashboard">
                    <img src="./icons/dashboard.png" alt="dashboard icon">
                    <li><a href="">Dashboard</a></li>
                </div>
                <div class="icon savings">
                    <img src="./icons/savings.png" alt="savings icon"> 
                    <li><a href="">Savings</a></li>
                </div>
                <div class="icon expenses">
                    <img src="./icons/expenses.png" alt="expenses icon">
                    <li><a href="">Expenses</a></li>
                </div>
                <div class="icon loans">
                    <img src="./icons/loans.png" alt="loans icon">
                    <li><a href="">Loans</a></li>
                </div>
                <div class="icon income">
                    <img src="./icons/income.png" alt="income icon ">
                    <li><a href="">Income</a></li>
                </div>
                <div class="icon goals">
                    <img src="./icons/goal.png" alt="goals icon">
                    <li><a href="">Goals</a></li>
                </div>
                <div class="icon reports">
                    <img src="./icons/report.png" alt="reports icon">   
                    <li><a href="">Reports</a></li>
                </div>
            </ul>
        </div>
        <div class="main-content">
            <div class="header">
                <div class="logo">
                    <img src="./images/velocity logo.png" alt="logo">
                </div>
                <h2>Hello User</h2>
                <div class="notification icon">
                    <img src="./icons/notification.png" alt="notification icon">
                </div>
                <div class="name">
                    <h2 class="username">John Doe</h2>
                </div>
            </div>
            <div class="content">
                <div class="cards">
                    <h3>Total Savings</h3>
                    <p>$10,000</p>
                </div>
                <div class="cards">
                    <h3>Total Expenses</h3>
                    <p>$5,000</p>
                </div>
                <div class="cards">
                    <h3>Total Loans</h3>
                    <p>$5,000</p>
                </div>
                <div class="cards">
                    <h3>Monthly Income</h3>
                    <p>$3,000</p>
                </div>
                <div class="cards">
                    <h3>Goals</h3>
                    <div class="goal">
                        <span>Target:</span>
                        <p class="target-amount">Kes20,000</p>
                    </div>
                    <div class="goal">
                        <span>Remaining:</span>
                        <p class="remaining-amount">Kes2,000</p>
                    </div>
                    <div class="progress-bar"></div>
                </div>
            </div>
            
        </div>

    </div>






</body>
</html>
