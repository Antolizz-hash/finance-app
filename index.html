<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="./styles/style.css"> 
    <script type="module" src="./script/script.js"></script>

</head>
<body>
    <div class="grid-container">

        <div class="sidebar">
            <div class="logo">
                <img src="./images/velocity logo.png" alt="logo">
            </div>
            <h3>Velocity Inc</h3>

            <ul>
                <div class="icon dashboard">
                    <img src="./icons/dashboard.png" alt="dashboard icon">
                    <li><a href="">Dashboard</a></li>
                </div>
                <div class="icon savings">
                    <img src="./icons/savings.png" alt="savings icon"> 
                    <li><a href="">Savings</a></li>
                </div>
                <div class="icon expenses">
                    <img src="./icons/expenses.png" alt="expenses icon">
                    <li><a href="/pages/expenses.html">Expenses</a></li>
                </div>
                <div class="icon loan">
                    <img src="./icons/loan.png" alt="loan icon">
                    <li><a href="/pages/loans.html">Loans</a></li>
                </div>
                <div class="icon income">
                    <img src="./icons/income.png" alt="income icon ">
                    <li><a href="">Income</a></li>
                </div>
                <div class="icon goals">
                    <img src="./icons/goal.png" alt="goals icon">
                    <li><a href="">Goals</a></li>
                </div>
                <div class="icon reports">
                    <img src="./icons/report.png" alt="reports icon">   
                    <li><a href="">Reports</a></li>
                </div>
            </ul>
        </div>
        <div class="main-content">
            <div class="header">
                <div class="logo">
                    <img src="./images/velocity logo.png" alt="logo">
                </div>
                <h2 class="user">Hello User</h2>
                <div class="notification icon">
                    <img src="./icons/notification.png" alt="notification icon">
                </div>
                <div class="name">
                    <h2 class="username">John Doe</h2>
                </div>
                <div class="profile-pic">
                    <img src="./images/profile picture.png" alt="profile picture">
                </div>
            </div>
            <div class="content">
                <div class="savings cards">
                    <h2>Savings</h2>
                    <p>ksh. 10,000</p>
                </div>
                <div class="expenses cards">
                    <h2>Expenses</h2>
                    <p>ksh. 5,000</p>
                </div>
                <div class="Loans cards">
                    <h2>Loans</h2>
                    <div class="loans">
                        <div class="amount">
                            <h4>Fuliza</h4>
                            <p class="loan-amount fuliza-amount">KES 0</p>
                            <p class="fuliza-due-date"></p>
                        </div>
                        <div class="amount">
                            <h4>Bridge Loan</h4>
                            <p class="loan-amount bridge-amount">KES 0</p>
                            <p class="bridge-due-date"></p>
                        </div>
                    </div>
                </div>
                <div class="income cards">
                    <h2>Income</h2>
                    <p>ksh. 7000</p>
                </div>
                <div class="goals cards">
                    <h2>Goals</h2>
                    <div class="goal">
                        <span>Target:</span>
                        <p class="target-amount">ksh. 20,000</p>
                    </div>
                    <div class="goal">
                        <span>Remaining:</span>
                        <p class="remaining-amount">ksh. 2,000</p>
                    </div>
                    <div class="progress-bar"></div>
                </div>
            </div>
            
        </div>

    </div>




<script type="module">
  
</script>

</body>
</html>
